name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build CLI binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          cd backend
          go build \
            -ldflags="-s -w -X 'github.com/tsdlamongan/whcms/backend/internal/cli.Version=${{ steps.version.outputs.version }}' -X 'github.com/tsdlamongan/whcms/backend/internal/cli.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)' -X 'github.com/tsdlamongan/whcms/backend/internal/cli.GitCommit=${{ github.sha }}'" \
            -o ../whcms-${{ steps.version.outputs.version }}-${{ matrix.suffix }} \
            ./cmd/cli

      - name: Build API binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          cd backend
          go build \
            -ldflags="-s -w" \
            -o ../whcms-api-${{ steps.version.outputs.version }}-${{ matrix.suffix }} \
            ./cmd/api

      - name: Build Worker binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          cd backend
          go build \
            -ldflags="-s -w" \
            -o ../whcms-worker-${{ steps.version.outputs.version }}-${{ matrix.suffix }} \
            ./cmd/worker

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.suffix }}
          path: |
            whcms-${{ steps.version.outputs.version }}-${{ matrix.suffix }}
            whcms-api-${{ steps.version.outputs.version }}-${{ matrix.suffix }}
            whcms-worker-${{ steps.version.outputs.version }}-${{ matrix.suffix }}
          retention-days: 7

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create release archives
        run: |
          cd artifacts
          for dir in binaries-*; do
            suffix=${dir#binaries-}
            cd $dir
            tar -czf ../../whcms-${{ steps.version.outputs.version }}-${suffix}.tar.gz *
            cd ..
          done

      - name: Generate checksums
        run: |
          sha256sum whcms-*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            whcms-*.tar.gz
            checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
